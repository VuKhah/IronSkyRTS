# Đăng game lên GitHub Pages: mỗi lần push lên main, máy chủ GitHub chạy kiểm thử, build rồi đăng bản mới.
# Kiểm thử hỏng thì KHÔNG đăng, nên trang web luôn là bản chạy được.
# Địa chỉ: https://vukhah.github.io/IronSkyRTS/  (Xưởng Mô Hình: …/IronSkyRTS/models.html)
name: Đăng GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # cho phép bấm chạy tay ở tab Actions

permissions:
  contents: read
  pages: write
  id-token: write

# chỉ một lần đăng chạy cùng lúc; lần push mới hơn không hủy lần đang đăng dở
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
